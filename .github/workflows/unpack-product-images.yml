name: Unpack product images

on:
  push:
    paths:
      - '.github/workflows/unpack-product-images.yml'
      - 'roomworthy-product-images.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack product images
        run: |
          mkdir -p assets/products
          unzip -o roomworthy-product-images.zip 'assets/products/*' -d .
      - name: Commit extracted images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/products
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Unpack product images for direct web use'
            git push
          fi
